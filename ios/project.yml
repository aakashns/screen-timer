name: ScreenTimer

options:
  bundleIdPrefix: com.aakashns
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_EMIT_LOC_STRINGS: YES

# Set DEVELOPMENT_TEAM here (or pick a team in Xcode's Signing pane) so the
# app group and Family Controls entitlements can be provisioned.
targets:

  ScreenTimer:
    type: application
    platform: iOS
    sources: [App, Shared, ScreenTime]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aakashns.screentimer
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/ScreenTimer.entitlements
    dependencies:
      - target: ScreenTimerMonitor
      - target: ScreenTimerReport
      - target: ScreenTimerWidget
      - sdk: FamilyControls.framework
      - sdk: DeviceActivity.framework

  # Writes real Screen Time milestones into the app group.
  ScreenTimerMonitor:
    type: app-extension
    platform: iOS
    sources: [Monitor, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aakashns.screentimer.monitor
        INFOPLIST_FILE: Monitor/Info.plist
        CODE_SIGN_ENTITLEMENTS: Monitor/Monitor.entitlements
    dependencies:
      - sdk: DeviceActivity.framework
      - sdk: WidgetKit.framework

  # Renders today's true total. Sandboxed; cannot return the number to anyone.
  ScreenTimerReport:
    type: app-extension
    platform: iOS
    sources: [Report, Shared, ScreenTime]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aakashns.screentimer.report
        INFOPLIST_FILE: Report/Info.plist
        CODE_SIGN_ENTITLEMENTS: Report/Report.entitlements
    dependencies:
      - sdk: DeviceActivity.framework
      - sdk: SwiftUI.framework

  ScreenTimerWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aakashns.screentimer.widget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/Widget.entitlements
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

schemes:
  ScreenTimer:
    build:
      targets:
        ScreenTimer: all
    run:
      config: Debug
